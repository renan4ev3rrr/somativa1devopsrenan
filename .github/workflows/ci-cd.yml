name: CI e CD

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Testes da aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Executar testes
        run: go test ./...

  cd:
    name: Validar imagem Docker
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t lista-tarefas:teste .

  alerta-discord:
    name: Enviar alerta para o Discord
    runs-on: ubuntu-latest
    needs:
      - ci
      - cd
    if: ${{ always() }}

    steps:
      - name: Enviar resultado para o Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CI_STATUS: ${{ needs.ci.result }}
          CD_STATUS: ${{ needs.cd.result }}

        run: |
          mensagem="Workflow CI/CD executado no repositório somativa1devopsrenan. CI: ${CI_STATUS} | Docker: ${CD_STATUS}"

          jq -n \
            --arg content "$mensagem" \
            '{content: $content}' > mensagem.json

          curl -fsS \
            -H "Content-Type: application/json" \
            -d @mensagem.json \
            "$DISCORD_WEBHOOK"